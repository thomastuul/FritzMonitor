name: Build packages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.format }} package
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - format: deb
          - format: rpm

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build package in distribution container
        run: ./scripts/package-in-container.sh "${{ matrix.format }}"

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: fritzmonitor-${{ matrix.format }}
          path: build/package-${{ matrix.format }}/fritzmonitor-*.${{ matrix.format }}
          if-no-files-found: error
