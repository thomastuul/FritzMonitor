name: Build packages

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  markdown:
    name: Markdown
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Check Markdown in container
        run: ./scripts/markdown-in-container.sh check

  package:
    name: ${{ matrix.format }} package
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - format: deb
          - format: rpm

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build package in distribution container
        run: ./scripts/package-in-container.sh "${{ matrix.format }}"

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: fritzmonitor-${{ matrix.format }}
          path: build/package-${{ matrix.format }}/fritzmonitor-*.${{ matrix.format }}
          if-no-files-found: error

  release:
    name: Create GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest

    steps:
      - name: Download package artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: fritzmonitor-*
          path: release-assets
          merge-multiple: true

      - name: Validate package versions
        shell: bash
        run: |
          expected_version="${GITHUB_REF_NAME#v}"
          shopt -s nullglob
          packages=(release-assets/fritzmonitor-*)
          test "${#packages[@]}" -eq 2
          for package in "${packages[@]}"; do
            case "$(basename "$package")" in
              "fritzmonitor-${expected_version}-"*) ;;
              *)
                echo "Package version does not match tag: $(basename "$package")" >&2
                exit 1
                ;;
            esac
          done

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "FritzMonitor $GITHUB_REF_NAME" \
            --generate-notes
